name: Refresh visitor locations

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/visitor-locations.yml'
      - 'scripts/refresh_visitors.py'

permissions:
  contents: write

concurrency:
  group: visitor-locations
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Read aggregate country totals
        run: python3 scripts/refresh_visitors.py --output visitors-next.json
      - name: Update the independent data feed
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const branch = 'visitor-data';
            const path = 'data/visitors.json';
            const repo = context.repo;
            const content = fs.readFileSync('visitors-next.json').toString('base64');
            try {
              await github.rest.git.getRef({...repo, ref: `heads/${branch}`});
            } catch (error) {
              if (error.status !== 404) throw error;
              const base = await github.rest.git.getRef({...repo, ref: 'heads/main'});
              await github.rest.git.createRef({...repo, ref: `refs/heads/${branch}`, sha: base.data.object.sha});
            }
            let sha;
            try {
              const current = await github.rest.repos.getContent({...repo, path, ref: branch});
              sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              ...repo, branch, path, sha, content,
              message: 'Refresh aggregate visitor countries'
            });
